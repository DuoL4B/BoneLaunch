[package]
name = "bonelaunch"
version = "1.1.0"
description = "A mod launcher for BONELAB with Thunderstore built in."
authors = ["DuoL4B"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["sync", "time"] }
winreg = "0.52"
trash = "5"
rfd = "0.15"
open = "5"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
